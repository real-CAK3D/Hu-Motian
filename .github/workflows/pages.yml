# Publishes pc/web as the installable phone app at https://real-cak3d.github.io/Hu-Motian/
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Phone app (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['pc/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pc/web
      - id: deploy
        uses: actions/deploy-pages@v4
